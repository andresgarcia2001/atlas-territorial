services:
  db:
    image: postgis/postgis:16-3.4
    container_name: territorio_argentino_db
    environment:
      POSTGRES_DB: territorio_argentino
      POSTGRES_USER: territorio
      POSTGRES_PASSWORD: territorio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema01.sql:/docker-entrypoint-initdb.d/schema01.sql
  backend:
    build: ./backend
    container_name: territorio_argentino_backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: territorio_argentino
      POSTGRES_USER: territorio
      POSTGRES_PASSWORD: territorio
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
    
  frontend:
    build: ./frontend
    container_name: territorio_argentino_frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
      
volumes:
  postgres_data:
  frontend_node_modules:
