services:
  db:
    image: postgis/postgis:16-3.4
    container_name: territorio_argentino_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-territorio_argentino}
      POSTGRES_USER: ${POSTGRES_USER:-territorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-territorio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    container_name: territorio_argentino_backend
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-territorio_argentino}
      POSTGRES_USER: ${POSTGRES_USER:-territorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-territorio}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  loader:
    build: ./backend
    container_name: territorio_argentino_loader
    profiles:
      - tools
    working_dir: /scripts
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-territorio_argentino}
      POSTGRES_USER: ${POSTGRES_USER:-territorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-territorio}
      PROVINCES_GEOJSON: ${PROVINCES_GEOJSON:-/data/poblacion_provincias_indec_2022.geojson}
    volumes:
      - ./scripts:/scripts:ro
      - ./data:/data:ro
    command: ["python", "load_provinces.py"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    
  frontend:
    build: ./frontend
    container_name: territorio_argentino_frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
      
volumes:
  postgres_data:
  frontend_node_modules:
